[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-router"
version = "3.1.0"
description = "One prompt router for Claude Code, OpenAI Codex and Google Antigravity: model, effort, parallel agents, skills, safety and queue protection per prompt."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["claude-code", "codex-cli", "antigravity", "llm-router", "prompt-router", "ai-agent", "cli"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/hajdu-patrik/claude-workspace"
Repository = "https://github.com/hajdu-patrik/claude-workspace"
Issues = "https://github.com/hajdu-patrik/claude-workspace/issues"
Changelog = "https://github.com/hajdu-patrik/claude-workspace/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev-router = "jev_router.cli:main"

[tool.setuptools]
packages = ["jev_router"]

[tool.setuptools.package-data]
jev_router = ["config/*.json", "templates/agents/*.md", "skills/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
